services:
  # API, bundled admin UI (/), docs (/docs/), and Swagger (/api/docs/) on port 4000.
  proxy:
    build: .
    ports:
      - "${HAAI_HOST_PROXY_PORT:-4000}:4000"
    networks:
      - default
      - tailscale
    volumes:
      - haai-data:/data
    environment:
      HAAI_HOST: "0.0.0.0"
      HAAI_PORT: "4000"
      HAAI_DATA_DIR: "/data"
      HAAI_LOG_LEVEL: "info"
      HAAI_LOG_FORMAT: "json"
      HAAI_DOCKER: "1"
      HAAI_CORS_ORIGINS: "${HAAI_CORS_ORIGINS:-http://localhost:4000,http://localhost:5173}"
      HAAI_URL: "http://localhost:${HAAI_HOST_PROXY_PORT:-4000}"
      HAAI_WEB_URL: "http://localhost:${HAAI_HOST_WEB_PORT:-5173}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Admin UI on the familiar dev port (proxies to the proxy service).
  web:
    image: nginx:1.27-alpine
    ports:
      - "${HAAI_HOST_WEB_PORT:-5173}:80"
    networks:
      - default
      - tailscale
    volumes:
      - ./docker/admin-ui.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped

  # Demo: LM Studio backend mock (for testing)
  mock-backend:
    build:
      context: .
      dockerfile: tools/mock-backend/Dockerfile
    ports:
      - "${HAAI_HOST_MOCK_PORT:-11434}:11434"
    environment:
      MOCK_PORT: "11434"
      MOCK_PROVIDER: "lmstudio"
      MOCK_HOST_NAME: "mock-host"
    profiles:
      - testing
    networks:
      - default
      - tailscale

  # Optional: join your Tailscale tailnet (docker compose --profile tailscale up -d)
  # Serves the proxy at https://<TS_HOSTNAME>.<tailnet>.ts.net
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-haai}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-haai}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: ${TS_USERSPACE:-true}
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: ${TS_ACCEPT_DNS:-true}
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
      TS_SOCKS5_SERVER: 0.0.0.0:1055
      TS_OUTBOUND_HTTP_PROXY_LISTEN: 0.0.0.0:1055
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - haai-tailscale-state:/var/lib/tailscale
      - ./docker/tailscale:/config:ro
    networks:
      - default
      - tailscale
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - tailscale

networks:
  tailscale:
    name: ${HAAI_TAILSCALE_NETWORK:-haai-tailscale}
    driver: bridge

volumes:
  haai-data:
  haai-tailscale-state:
